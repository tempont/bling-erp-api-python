name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-groups --python ${{ matrix.python-version }}
      - name: Ruff check
        run: uv run --all-groups ruff check .
      - name: Ruff format check
        run: uv run --all-groups ruff format --check .
      - name: Basedpyright
        run: uv run --all-groups basedpyright
      - name: Pytest
        run: uv run --all-groups python -m pytest

  codegen-drift:
    name: Codegen Drift Check
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-groups --python 3.12
      - name: Codegen drift check
        run: make codegen-check
